# Third build of the runner: the same `src/main.rs` against Blitz's parallel-layout prototype
# (DioxusLabs/blitz#1034, branched from the `28f848d` the other builds use; it pins Taffy `8cbdeb1`
# instead of `ea07c4c`), with `parallel-layout` + `parallel-construct` on. Not a workspace member
# because it needs a different Blitz revision:
#   cargo build --release --manifest-path blitz-runner-pl/Cargo.toml --target-dir target-pl
[package]
name = "layout-bench-blitz-pl"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "blitz-runner"
path = "../blitz-runner/src/main.rs"

[dependencies]
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "0500fd4a", default-features = false, features = ["log-phase-times", "floats", "writing-mode", "parallel-construct", "parallel-layout"] }
blitz-html = { git = "https://github.com/DioxusLabs/blitz", rev = "0500fd4a", default-features = false }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz", rev = "0500fd4a", default-features = false }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "0500fd4a" }
anyrender = "0.14"
anyrender_vello_cpu = "0.18"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png"] }

[patch."https://github.com/DioxusLabs/blitz"]
debug_timer = { path = "../vendor/debug_timer" }

[profile.release]
debug = 1
