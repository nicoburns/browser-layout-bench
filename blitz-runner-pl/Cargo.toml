# Third build of the runner: the same `src/main.rs` against Blitz's parallel-layout prototype
# (DioxusLabs/blitz#1034) merged onto the revision the other builds use (Blitz `main` + #1237 with
# Taffy pinned to `main` + #1343; here Taffy additionally carries taffy#1230, the prototype's batching
# API), with `parallel-layout` + `parallel-construct` on. Branch: DioxusLabs/blitz `bench/main-1237-taffy1343-1034`.
# Not a workspace member because it needs a different Blitz revision:
#   cargo build --release --manifest-path blitz-runner-pl/Cargo.toml --target-dir target-pl
[package]
name = "layout-bench-blitz-pl"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "blitz-runner"
path = "../blitz-runner/src/main.rs"

[dependencies]
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "fac9b35833e89a67b892a45c01392a3e702d1920", default-features = false, features = ["log-phase-times", "floats", "writing-mode", "parallel-construct", "parallel-layout"] }
blitz-html = { git = "https://github.com/DioxusLabs/blitz", rev = "fac9b35833e89a67b892a45c01392a3e702d1920", default-features = false }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz", rev = "fac9b35833e89a67b892a45c01392a3e702d1920", default-features = false }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "fac9b35833e89a67b892a45c01392a3e702d1920" }
anyrender = "0.14"
anyrender_vello_cpu = "0.18"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png"] }
# Global allocator (see `main.rs`): glibc malloc was ~37% of the `layout` phase on the 100k-node cases
mimalloc = "0.1"

[patch."https://github.com/DioxusLabs/blitz"]
debug_timer = { path = "../vendor/debug_timer" }


[profile.release]
debug = 1
