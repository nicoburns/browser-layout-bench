# Builds the results site (./run.py pages) and deploys it to GitHub Pages. Nothing is committed: the
# site is rebuilt from out/results.json, README.md and CAVEATS.md on every push to main that touches them.
name: pages

on:
  push:
    branches: [main]
    paths:
      - out/results.json
      - README.md
      - CAVEATS.md
      - pages.py
      - web/**
      - plot.py
      - run.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # plot.py uses PEP 701 f-strings (Python >= 3.12)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python ./run.py pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
