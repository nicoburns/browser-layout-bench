[workspace]
resolver = "2"
members = ["gen", "blitz-runner"]

[workspace.dependencies]
taffy = { git = "https://github.com/DioxusLabs/taffy", rev = "4e59968eda29ceeb0bbaeb3993c8cd38baa3d0a6", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "content_size"] }
taffy_benchmarks = { git = "https://github.com/DioxusLabs/taffy", rev = "4e59968eda29ceeb0bbaeb3993c8cd38baa3d0a6", package = "taffy_benchmarks" }
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "1c5265a8b3985e1ec05044a115b2ec6266e3fa91", default-features = false }
blitz-html = { git = "https://github.com/DioxusLabs/blitz", rev = "1c5265a8b3985e1ec05044a115b2ec6266e3fa91", default-features = false }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz", rev = "1c5265a8b3985e1ec05044a115b2ec6266e3fa91", default-features = false }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "1c5265a8b3985e1ec05044a115b2ec6266e3fa91" }

[patch."https://github.com/DioxusLabs/blitz"]
debug_timer = { path = "./vendor/debug_timer" }


[profile.release]
debug = 1
