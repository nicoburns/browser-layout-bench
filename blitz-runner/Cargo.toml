[package]
name = "layout-bench-blitz"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "blitz-runner"
path = "src/main.rs"

[features]
# Second build of the runner with Blitz's parallel deferred construction (Parley layout builds).
parallel-construct = ["blitz-dom/parallel-construct"]
# blitz-dom's opt-in layout features (neither is in its defaults; `apps/browser` enables `floats`).
# The measured builds enable both; the real pages use floats.
floats = ["blitz-dom/floats"]
writing-mode = ["blitz-dom/writing-mode"]
# `--cache-stats`: per-node Taffy cache occupancy and hit/miss/eviction counters after each layout.
# Needs Taffy patched with `patches/taffy-cache-occupancy.patch` (see cache-occupancy/README.md).
cache-stats = []

[dependencies]
# Blitz's own Taffy (the `Cache` type behind `Node::cache()`), for `--cache-stats`
taffy = { git = "https://github.com/DioxusLabs/taffy", rev = "802e497b69689e1c93be2d16e9d53a973971bcb2", default-features = false }
blitz-dom = { workspace = true, features = ["log-phase-times"] }
blitz-html = { workspace = true }
blitz-paint = { workspace = true }
blitz-traits = { workspace = true }
anyrender = "0.14"
anyrender_vello_cpu = "0.18"
png = "0.18"
# blitz-dom decodes images with `image` built without default features; enable the PNG decoder so
# the real pages' placeholder images load (their intrinsic size feeds `max-height`/`height:auto` sizing)
image = { version = "0.25", default-features = false, features = ["png"] }
# Global allocator (see `main.rs`): glibc malloc was ~37% of the `layout` phase on the 100k-node cases
mimalloc = "0.1"
